# Temporary: lets the Redis pod "see everything" while debugging a connection issue
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: data-default-debug
subjects:
  - kind: ServiceAccount
    name: default
    namespace: data
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
