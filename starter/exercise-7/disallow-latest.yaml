# Interdire le tag "latest" ET les images sans tag (= latest)
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sdisallowlatest
spec:
  crd:
    spec:
      names:
        kind: K8sDisallowLatest
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sdisallowlatest

        # Règle 1 (fournie): une image qui finit par ":latest"
        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          endswith(container.image, ":latest")
          msg := sprintf("image %v en latest interdite", [container.image])
        }

        # Règle 2 (TODO): une image SANS tag, ex. "redis"
        # Aide: contains(chaine, ":") est vrai si la chaîne contient ":";
        #       "not" devant une ligne inverse la condition
        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          TODO
          msg := sprintf("image %v sans tag (= latest)", [container.image])
        }
---
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sDisallowLatest
metadata:
  name: no-latest
spec:
  enforcementAction: TODO        # "dryrun" pour commencer, puis "deny"
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    namespaces: TODO             # vos namespaces + policy-test
