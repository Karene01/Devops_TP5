# Blocs à compléter puis à coller dans vos manifestes (ce fichier ne s'applique pas tel quel).
# Les commentaires disent OU coller chaque bloc.

# ---------------------------------------------------------------------------
# 1. Redis: deploy/redis/redis-deployment.yaml, sous spec.template.spec
# ---------------------------------------------------------------------------
automountServiceAccountToken: false      # Redis appelle-t-il l'API Kubernetes ?
securityContext:
  runAsNonRoot: true
  runAsUser: 999                       # l'UID de l'utilisateur "redis" de l'image
  runAsGroup: 999
  fsGroup: 999                         # pour pouvoir écrire dans /data
  seccompProfile:
    type: RuntimeDefault                         # le profil par défaut du runtime

# 2. Redis: sous spec.template.spec.containers[0] (le conteneur redis)
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 200m                       # le faux mineur ne doit pas dépasser cette valeur
    memory: 128Mi

# ---------------------------------------------------------------------------
# 3. Guestbook: deploy/guestbook/templates/deployment.yaml, mêmes emplacements
#    (sous spec.template.spec, puis dans le conteneur), avec runAsUser: 65532
# ---------------------------------------------------------------------------
# niveau spec.template.spec
automountServiceAccountToken: false       # le guestbook n'appelle pas non plus l'API Kubernetes
securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# niveau conteneur
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
# ---------------------------------------------------------------------------
# 4. Namespaces: deploy/namespaces.yaml, sous metadata de chaque namespace
# ---------------------------------------------------------------------------
labels:
  pod-security.kubernetes.io/warn: restricted
  pod-security.kubernetes.io/enforce: restricted
